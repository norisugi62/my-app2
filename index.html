<!doctype html>
<html lang="js">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO(JS)</title>
  </head>
  <body>
    <div class="todo">
      <div class="todo__input">
        <input
          type="text"
          name="todo"
          placeholder="TODOを入力"
          class="todo__input-field"
        />
        <button class="button">追加</button>
      </div>

      <div class="todo__incomplete">
        <p class="todo__section-title">未完了のTODO</p>
        <ul class="todo__list">
          <li class="todo__item">
            <div class="todo__item-content">
              <p class="todo__item-text">TODOです</p>
              <button class="todo__complete-button">完了</button>
              <button class="todo__delete-button">削除</button>
            </div>
          </li>

          <li class="todo__item">
            <div class="todo__item-content">
              <p class="todo__item-text">TODOです</p>
              <button class="todo__complete-button">完了</button>
              <button class="todo__delete-button">削除</button>
            </div>
          </li>
        </ul>
      </div>

      <div class="todo__complete">
        <p class="todo__section-title">完了のTODO</p>
        <ul class="todo__list">
          <li class="todo__item">
            <div class="todo__item-content">
              <p class="todo__text">TODOでした</p>
              <button class="todo__back-button">戻す</button>
            </div>
          </li>

          <li class="todo__item">
            <div class="todo__item-content">
              <p class="todo__text">TODOでした</p>
              <button class="todo__back-button">戻す</button>
            </div>
          </li>
        </ul>
      </div>
    </div>
    <script type="module" src="./src/js/common/main.js"></script>
  </body>
</html>
