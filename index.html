<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO(vanilla JS)</title>
  </head>
  <body>
    <div class="todo">
      <div class="todo__input">
        <input id="todo__input-text" type="text" name="todo" placeholder="TODOを入力" class="todo__input-field" />
        <button id="todo__add-button" class="button">追加</button>
      </div>

      <div class="todo__incomplete">
        <p class="todo__section-title">未完了のTODO</p>
        <ul id="todo__incomplete-list" class="todo__list"></ul>
        <template id="todo__incomplete-template">
          <li class="todo__item">
            <div class="todo__item-content">
              <p class="todo__item-text"></p>
              <button class="todo__up-button button">↑</button>
              <button class="todo__down-button button">↓</button>
              <button class="todo__complete-button button">完了</button>
              <button class="todo__delete-button button">削除</button>
            </div>
          </li>
        </template>
      </div>

      <div class="todo__complete">
        <p class="todo__section-title">完了のTODO</p>
        <ul id="todo__complete-list" class="todo__list"></ul>
        <template id="todo__complete-template">
          <li class="todo__item">
            <div class="todo__item-content">
              <p class="todo__item-text"></p>
              <button class="todo__up-button button">↑</button>
              <button class="todo__down-button button">↓</button>
              <button class="todo__back-button button">戻す</button>
            </div>
          </li>
        </template>
      </div>
    </div>
    <script type="module" src="./src/js/common/main.js"></script>
  </body>
</html>
